[workspace]
resolver = "3"
members = [
    "xtask",
    "packaging",
    "cli",
    "crates/femacs-pure",
    "crates/femacs-sys",
    "crates/femacs-vm",
    "crates/femacs-host",
    "crates/femacs-tools",
    "crates/http-host",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
panic = "unwind"
lto = "thin"

[profile.release.package.femacs-vm]
opt-level = 2
overflow-checks = false
debug-assertions = false
codegen-units = 1

[profile.release.package.femacs-sys]
opt-level = 2
overflow-checks = false
debug-assertions = false
codegen-units = 1

[profile.release.package.femacs-pure]
opt-level = 2
overflow-checks = true

[profile.release.package.femacs-tools]
opt-level = 2
overflow-checks = true

[profile.release.package.http-host]
opt-level = 2
overflow-checks = true
