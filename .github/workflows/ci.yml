name: ci
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
jobs:
  standalone-macos:
    runs-on: macos-26
    env:
      CARGO_TARGET_DIR: build/cargo
    steps:
      - uses: actions/checkout@v4
      - name: Install declared prerequisites
        run: brew install gawk
      - name: Check root layout and committed build inputs
        run: python3 tools/test-repository-bootstrap.py
      - name: Build terminal from owned source only
        run: cargo run -p xtask -- build-terminal
      - name: Batch edit and Unicode smoke
        run: build/terminal/port/src/emacs -Q --batch --eval '(progn (with-temp-buffer (insert "你好 abc") (goto-char (point-min)) (forward-char 2) (unless (= (point) 3) (error "Unicode movement failed"))) (princ "standalone batch ok"))'
      - name: Build native application from owned source only
        run: cargo run -p xtask -- build-macos
      - name: Verify application signature and batch startup
        run: |
          codesign --verify --deep --strict dist/macos/Femacs.app
          dist/macos/Femacs.app/Contents/MacOS/Femacs -Q --batch --eval '(princ "Cocoa batch ok")'
