[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true

# No dependencies on purpose: the build driver must work offline, and every
# input it reads is generated by this repository's own tooling.
[dependencies]

# ---- the ported tree's `cfg (feature = "…")` namespace -----------------------------------
# Every `#[cfg (feature = "…")]` name the ported tree uses, all off by default: rustc sees the
# frozen configuration unless `xtask` passes `--cfg 'feature="…"'` explicitly, which P-51's
# `dead-arms` does for the names in its FLIPS table.
#
# The section lives in *this* manifest because `femacs/Cargo.toml` is a *virtual* manifest and
# cargo rejects a `[features]` table there - measured: `cargo metadata --no-deps` ->
# "error: failed to parse manifest at `.../femacs/Cargo.toml` / Caused by: this virtual manifest
# specifies a `features` section, which is not allowed".  xtask is the workspace's only package,
# so this is the one manifest that can declare them today; the table documents the *ported tree's*
# namespace (not xtask's) and moves with it when that tree gets a package of its own.
#
# Generated from the tree (`git ls-files` + every `feature = "…"` name; 545 names, plus `default`).  The comment on a
# line names the C condition the feature stands for: a macro verified against `emacs/`'s own `#if`
# conditions (403 rows; a name starting with `no_` stands for the *non*-frozen side of its condition -
# P-51 - so its comment is `!<MACRO>`), or, where no single macro resolves (142 rows: the
# gnulib-derived names such as `cplusplus`, the `@PLACEHOLDER@` templates), the first site that
# uses the feature.
[features]
b1152000                                   = []  # B1152000
b1500000                                   = []  # B1500000
b2500000                                   = []  # B2500000
b3000000                                   = []  # B3000000
b307200                                    = []  # B307200
