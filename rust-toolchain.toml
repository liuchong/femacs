# Pinned by PORTING.md P-04: C-variadic function definitions (`doprnt.c` and the other
# printf-family callers) need `c_variadic`, which the installed stable 1.98.1 lacks.
#
# Resolution on 2026-10-02, recorded with docs/spikes/2026-10-02-variadics.md:
#   the feature is stable as of 1.99.0, so the port needs **no** `#![feature]` attribute
#   (an inner attribute is illegal in an `include!`d file anyway, as the probe authors
#   found); stable 1.98.1 therefore reports E0658, and both `nightly-2026-09-14`
#   (4b6d04e70, rustc 1.100.0-nightly) and `nightly-2026-10-01` compile the same file
#   without the attribute.  The pin is the newer dated nightly because it is the one
#   `gate-fast` was measured with, not because the older one fails (reviews A and D both
#   found that claim in the first version of this comment and in the spike document).
#   When a stable >= 1.99 ships, point this at it.
[toolchain]
channel = "nightly-2026-10-01"
