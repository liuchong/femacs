[package]
name = "lisp-core"
version = "0.0.1"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
description = "Standalone general-purpose Lisp programming language runtime, embedding engine, and CLI"
repository = "https://github.com/liuchong/femacs"
readme = "README.md"
keywords = ["lisp", "language", "scripting", "interpreter", "cli"]
categories = ["command-line-utilities", "compilers", "development-tools"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "lisp-core"
path = "src/main.rs"
required-features = ["vm"]

[[test]]
name = "engine_integration"
harness = false
required-features = ["vm"]

[[test]]
name = "std_batteries_integration"
harness = false
required-features = ["vm", "std-batteries"]

[features]
default = ["vm", "repl-tty", "std-batteries"]
vm = ["dep:lisp-vm", "lisp-vm/isolate_vm", "dep:toml"]
repl-tty = ["vm", "dep:rustyline"]
std-batteries = ["vm", "dep:lisp-std"]

[dependencies]
lisp-vm = { version = "0.0.1", path = "../lisp-vm", optional = true }
lisp-std = { version = "0.0.1", path = "../lisp-std", optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rustyline = { version = "15", default-features = false, features = ["with-file-history"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = { version = "0.8", optional = true }

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
