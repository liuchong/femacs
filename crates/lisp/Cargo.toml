[package]
name = "lisp"
version = "0.0.1"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
description = "Standalone pure-Rust, No-GIL, Elisp-compatible embeddable Lisp runtime and standard library"
repository = "https://github.com/liuchong/femacs"
readme = "README.md"
keywords = ["lisp", "elisp", "language", "scripting", "interpreter"]
categories = ["compilers", "development-tools", "embedded"]

[lib]
path = "src/lib.rs"

[[test]]
name = "engine_integration"
harness = false
required-features = ["vm"]

[[test]]
name = "std_batteries_integration"
harness = false
required-features = ["vm", "std"]

[features]
default = ["vm", "std"]
vm = ["dep:lisp-vm", "lisp-vm/isolate_vm", "dep:flate2"]
std = ["vm", "dep:lisp-std"]
pkg = ["vm", "dep:toml"]

[dependencies]
lisp-vm = { version = "0.0.1", path = "../lisp-vm", optional = true }
lisp-std = { version = "0.0.1", path = "../lisp-std", optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
toml = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
