[package]
name = "femacs-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "temacs"
path = "src/bin/temacs.rs"

[[bin]]
name = "femacs-lisp"
path = "src/bin/femacs_lisp.rs"

[[test]]
name = "a1_host_acceptance"
harness = false

[features]
default = []
tty_terminfo = ["lisp-vm/tty_terminfo"]
have_ns = ["lisp-vm/have_ns"]
have_window_system = ["lisp-vm/have_window_system"]
dispextern_face_records = ["lisp-vm/dispextern_face_records"]
have_modules = ["lisp-vm/have_modules"]
have_native_comp = ["lisp-vm/have_native_comp"]
enable_checking = ["lisp-vm/enable_checking"]
femacs_gc_observer = ["lisp-vm/femacs_gc_observer"]
femacs_gc_generational = ["lisp-vm/femacs_gc_generational"]
femacs_gc_observer_test_hooks = ["lisp-vm/femacs_gc_observer_test_hooks"]

[dependencies]
lisp-vm = { path = "../lisp-vm" }
lisp-core = { path = "../lisp-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
